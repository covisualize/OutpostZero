name: Blender assets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  plan:
    name: Pipeline tests and changed-asset plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy for the material library
        run: python3 -m pip install numpy
      - name: Pipeline, manifest, texture, and audit tests
        run: python3 -m unittest discover -s BlenderScripts -p "test_*.py" -v
      - name: Committed material library matches its generator
        run: python3 BlenderScripts/material_library.py --check
      - name: Committed audio mixer matches its generator
        run: python3 Tools/Audio/make_mixer.py --check
      - name: List assets this change touches
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$base" ] && git cat-file -e "$base:Assets/Models/.pipeline-cache.json" 2>/dev/null; then
            git show "$base:Assets/Models/.pipeline-cache.json" > /tmp/base-cache.json
          else
            echo '{}' > /tmp/base-cache.json
          fi
          python3 BlenderScripts/pipeline.py --changed --dry-run --cache /tmp/base-cache.json --json changed-assets.json
      - uses: actions/upload-artifact@v4
        with:
          name: changed-assets
          path: changed-assets.json

  generate:
    name: Headless Blender 4.2 build
    runs-on: ubuntu-latest
    needs: plan
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.2 LTS
        run: |
          set -euo pipefail
          curl -L "https://download.blender.org/release/Blender4.2/blender-4.2.11-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          mkdir -p "$HOME/blender"
          tar -xJf /tmp/blender.tar.xz -C "$HOME/blender" --strip-components=1
          echo "$HOME/blender" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: changed-assets
      - name: Rebuild stale assets
        run: blender -b --factory-startup --python-exit-code 1 -P BlenderScripts/pipeline.py -- --changed
      - name: Fail if committed models are stale
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- Assets/Models ':(exclude)*.meta.json')" ]; then
            git status --short -- Assets/Models
            echo "::error::Generators changed without a rebuild. Run pipeline.py -- --changed and commit Assets/Models."
            exit 1
          fi
      - name: Full rebuild must match the committed bytes
        run: |
          set -euo pipefail
          blender -b --factory-startup --python-exit-code 1 -P BlenderScripts/pipeline.py -- --models-dir /tmp/full-build
          diff -rq -x '*.meta' -x '*.meta.json' -x '.pipeline-cache.json' /tmp/full-build Assets/Models > /tmp/drift.txt || true
          if grep -E '^(Files .* differ|Only in /tmp/full-build)' /tmp/drift.txt; then
            echo "::error::A full rebuild does not reproduce the committed models byte-for-byte."
            exit 1
          fi
          echo "Full build is byte-identical to the committed models."
      - name: Collect changed models
        run: |
          set -euo pipefail
          mkdir -p changed-models
          python3 - <<'EOF'
          import json, os, shutil
          plan = json.load(open("changed-assets.json"))
          for fbx in plan["outputs"]:
              stem = fbx[:-4]
              for path in [fbx, stem + ".meta.json"] + [stem + "_" + s + ".png" for s in ("Albedo", "Normal", "AO", "Mask", "Icon")]:
                  if os.path.isfile(path):
                      dest = os.path.join("changed-models", path)
                      os.makedirs(os.path.dirname(dest), exist_ok=True)
                      shutil.copy(path, dest)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: blender-fbx
          path: Assets/Models
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: changed-models
          path: changed-models
          if-no-files-found: ignore
      - name: Comment the changed asset list on the PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = JSON.parse(fs.readFileSync('changed-assets.json', 'utf8'));
            const marker = '<!-- outpost-asset-plan -->';
            const lines = plan.assets.length
              ? plan.assets.map((id, i) => `| \`${id}\` | \`${plan.outputs[i]}\` |`).join('\n')
              : '';
            const body = plan.assets.length
              ? `${marker}\n**Blender assets changed by this PR: ${plan.assets.length}**\n\n| Asset | Output |\n| --- | --- |\n${lines}\n\nThe \`changed-models\` artifact on this run holds the rebuilt files.`
              : `${marker}\n**Blender assets:** no model changes in this PR.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
